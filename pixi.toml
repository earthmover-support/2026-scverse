[workspace]
name = "2026-scverse"
description = "Versioning and virtualizing single-cell and spatial data with Icechunk"
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[dependencies]
python = "3.13.*"
anndata = ">=0.13.2,<0.14"
zarr = ">=3.3.0,<4"
xarray = ">=2026.7.0,<2027"
h5py = ">=3.16.0,<4"
scipy = ">=1.18.0,<2"
numpy = ">=2.4,<3"  # upper end held back so scanpy/numba can resolve
pandas = ">=3.0.5,<4"
virtualizarr = ">=2.7.1,<3"
icechunk = ">=2.1.2,<3"
obstore = ">=0.11.0,<0.12"
jupyterlab = ">=4.6.2,<5"
arraylake = ">=1.2.0,<2"
pyarrow = ">=25.0.0,<26"
pytest = ">=9.1.1,<10"
scanpy = ">=1.12.3,<2"
s3fs = ">=2026.6.0,<2027"
moto = ">=5.2.2,<6"
spatialdata = ">=0.8.0,<0.9"

[tasks]
lab = "jupyter lab notebooks/"
# The prototype's tests need the spatial environment. `spike-test` deselects the network and
# arraylake tests, and the PYTHONPATH-dependent tests skip without the fork. See docs/fork-pin.md.
check = "python checks/h5ad_virtualization.py"
check-s3 = "python checks/virtualize_cellxgene.py"
check-concat = "python checks/virtual_csr_concat.py"
check-icechunk = "python checks/icechunk_many_arrays.py"
check-manifest = "python checks/census_manifest_scale.py"
check-sparsity = "python checks/block_sparsity.py"
check-tenx = "python checks/tenx_matrix_virtualization.py"
check-store-path = "python checks/spatialdata_store_path.py"
equivalence = "python scripts/build_equivalence_notebook.py"
equivalence-run = { cmd = "jupyter nbconvert --to notebook --execute --inplace --ExecutePreprocessor.timeout=1800 notebooks/scanpy_equivalence.ipynb", depends-on = ["equivalence"] }
notebook = "python scripts/build_notebook.py"
notebook-run = { cmd = "jupyter nbconvert --to notebook --execute --inplace --ExecutePreprocessor.timeout=3600 notebooks/virtualize_braun.ipynb", depends-on = ["notebook"] }

# SpatialData on Icechunk needs pull request #1107 and five more commits. A git pin does not
# solve, so `sdpr` fetches it. See docs/fork-pin.md.
[feature.spatial]
platforms = ["osx-arm64", "linux-64"]

[feature.spatial.dependencies]
python = "3.12.*"
zarr = ">=3.3.0,<4"
pydantic = ">=2.11.5,<2.13"
pyproj = "*"
arro3-core = "*"
pytest = ">=9,<10"
matplotlib-base = "*"
# Cell 32 of spatialdata_on_icechunk.ipynb decodes the OME-TIFF's JPEG 2000 tiles through it.
imagecodecs = "*"
nbformat = ">=5,<6"
nbconvert = ">=7,<8"
ipykernel = ">=6,<7"
jupyterlab = ">=4.6.2,<5"

[feature.spatial.pypi-dependencies]
icechunk = "==2.3.0a1"
virtualizarr = ">=2.7.3,<3"
zarr-files = { git = "https://github.com/earth-mover/zarr-files.git", rev = "81c5ca8eca8a15808112b38d1736eeb2f3ff4e6c" }
icechunk-spatialdata = { path = "./icechunk-SpatialData", editable = true }

[feature.spatial.tasks]
spike-test = "pytest icechunk-SpatialData/tests -q -ra -m 'not network and not arraylake'; rc=$?; echo 'NOTE: network and arraylake tests are deselected. 14 core tests skip without the fork on PYTHONPATH. See docs/fork-pin.md.'; exit $rc"
sdpr = "python scripts/fetch_spatialdata_pr1107.py"
spatialdata = "python scripts/build_spatialdata_notebook.py"
spatialdata-run = { cmd = "jupyter nbconvert --to notebook --execute --inplace --ExecutePreprocessor.timeout=3600 notebooks/spatialdata_on_icechunk.ipynb", depends-on = ["spatialdata"] }
versioning = "python scripts/build_versioning_notebook.py"
versioning-run = { cmd = "jupyter nbconvert --to notebook --execute --inplace --ExecutePreprocessor.timeout=1800 notebooks/spatialdata_versioning.ipynb", depends-on = ["versioning"] }

[environments]
spatial = { features = ["spatial"], no-default-feature = true }
